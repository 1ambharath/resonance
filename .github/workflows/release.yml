name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'resonance' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'resonance' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'resonance' }}

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/Resonance-${{ github.ref_name }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/Resonance-${{ github.ref_name }}.apk
          fi

      - name: Generate Release Notes from CHANGELOG
        run: |
          python3 -c "
          import sys, re
          tag = '${{ github.ref_name }}'
          version = tag.lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\n---\n\n##|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else ''
          except Exception as e:
              notes = ''

          body = f'### 🚀 What\'s Changed in {tag}\n\n'
          if notes:
              body += f'{notes}\n\n'
          else:
              body += 'Multi-device low-latency audio relay for Android & Web.\n\n'

          body += '---\n#### 📲 How to Install & Update\n'
          body += f'1. Download `Resonance-{tag}.apk` below.\n'
          body += '2. Open the downloaded APK on your Android device.\n'
          body += '3. If prompted, allow installation from this source.\n'
          body += '4. Tap **Install** or **Update**. Local settings and paired devices will be preserved!\n'

          with open('release-notes.md', 'w', encoding='utf-8') as f:
              f.write(body)
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Resonance-${{ github.ref_name }}.apk
          name: "Resonance ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
